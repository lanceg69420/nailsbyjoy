<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nails by Joy</title>

    <link rel="stylesheet" href="https://unpkg.com/swiper@8/swiper-bundle.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="/LOGOO.png" type="image/x-icon">
    <script src="one.js"></script>
    <script src="https://kit.fontawesome.com/5d7cbd0185.js" crossorigin="anonymous"></script>
</head>

<body>

    <div class="intro-overlay" id="introOverlay">
        <div class="intro-content">
            <div class="logo-frame intro-logo-frame">
                <img src="/LOGOO.png" class="intro-logo-img" alt="Nails by Joy Logo">
            </div>
            <h1 class="intro-title">Nails by Joy</h1>
            <p class="intro-subtitle">Elegance at Your Fingertips</p>
        </div>
    </div>

    <header>
        <a href="/index.html">
            <div class="logo-frame header-logo-frame">
                <img src="/LOGOO.png" class="logo" alt="Nails by Joy Logo">
            </div>
        </a>

        <a href="/index.html">
            <h1>Nails by Joy</h1>
        </a>

        <div class="one" onclick="toggleMenu();"></div>

        <ul class="navigation">
            <li><a href="/index.html">Home</a></li>
            <li><a href="/portfolio/portfolio.html" class="active">Portfolio</a></li>
            <li><a href="/pricelist/Pricelist.html">Price List</a></li>
            <li><a href="/policies/Policies.html">Policies</a></li>

            <li>
                <button class="open-form-btn" onclick="openFormPopup()">Book Here</button>
            </li>
        </ul>
    </header>

    <div class="container">
        <div class="top-content">
            <button class="filter-tab active" onclick="filterGallery('mani2025', this)">Manicure (2025)</button>
            <button class="filter-tab" onclick="filterGallery('mani2026', this)">Manicure (2026)</button>
            <button class="filter-tab" onclick="filterGallery('pedi2026', this)">Pedicure (2026)</button>
        </div>
    </div>

    <section id="arigato">
        <div class="konteyner">
            <div class="swiper arigato-slider">
                <div class="swiper-wrapper" id="swiperWrapper"></div>

                <div class="arigato-slider-control">
                    <div class="slider-arrow slider-prev-btn">
                        <ion-icon name="arrow-back-outline"></ion-icon>
                    </div>
                    
                    <div class="swiper-pagination slider-dots"></div>
                    
                    <div class="slider-arrow slider-next-btn">
                        <ion-icon name="arrow-forward-outline"></ion-icon>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
    <script src="https://unpkg.com/swiper@8/swiper-bundle.min.js"></script>

    <script>
        // Photo library categorized by filter
        const photoData = {
            mani2025: [
                { img: "/portfolio/images/(2025) manicure-20260901t092130z-1-001/(2025) manicure/1.jpg", title: "" },
                ...Array.from({ length: 25 }, (_, i) => ({
                    img: `/portfolio/images/(2025) manicure-20260901T092130Z-1-001/(2025) manicure/${i + 2}.PNG`,
                    title: ""
                }))
            ],
            mani2026: Array.from({ length: 74 }, (_, i) => ({
                img: `/portfolio/images/(2025) manicure-20260901T092130Z-1-001/(2025) manicure/${i + 1}.PNG`,
                title: ""
            })),
            pedi2026: Array.from({ length: 4 }, (_, i) => ({
                img: `/portfolio/images/(2026) pedicure-20260901T123702Z-1-001/(2026) pedicure/${i + 1}.PNG`,
                title: ""
            }))
        };

        let swiper = null;
        let activeList = [];
        let curIndex = 0;
        const WINDOW_SIZE = 4; // Keeps 9 active slides in DOM (prevents GPU memory exhaustion & crash)

        function renderSlideHtml(dataIndex) {
            const item = activeList[dataIndex];
            return `
                <div class="swiper-slide arigato-slide" data-real-index="${dataIndex}">
                    <div class="arigato-weee-img">
                        <img src="${item.img}" alt="${item.title}">
                    </div>
                    <div class="arigato-kontint-gosaymas">
                        <h1 class="number">${dataIndex + 1}</h1>
                        <div class="arigato-kontint-gosaymas-bottom">
                            <h2 class="pangalan">${item.title}</h2>
                        </div>
                    </div>
                </div>
            `;
        }

        function buildWindowHtml(centerIdx) {
            const total = activeList.length;
            let html = '';
            for (let offset = -WINDOW_SIZE; offset <= WINDOW_SIZE; offset++) {
                const actualIdx = (centerIdx + offset + total * 10) % total;
                html += renderSlideHtml(actualIdx);
            }
            return html;
        }

        function updatePagination() {
            const paginationEl = document.querySelector('.swiper-pagination');
            if (paginationEl && activeList.length > 0) {
                paginationEl.innerHTML = `<span class="swiper-pagination-current">${curIndex + 1}</span> / <span class="swiper-pagination-total">${activeList.length}</span>`;
            }
        }

        function initWindowedSwiper(items) {
            activeList = items;
            curIndex = 0;

            if (swiper) {
                swiper.destroy(true, true);
            }

            const wrapper = document.getElementById('swiperWrapper');
            wrapper.innerHTML = buildWindowHtml(curIndex);

            swiper = new Swiper('.arigato-slider', {
                effect: 'coverflow',
                grabCursor: true,
                centeredSlides: true,
                initialSlide: WINDOW_SIZE,
                slidesPerView: 'auto',
                speed: 400,
                coverflowEffect: {
                    rotate: 0,
                    stretch: 0,
                    depth: 100,
                    modifier: 2.5,
                    slideShadows: false
                }
            });

            updatePagination();

            const nextBtn = document.querySelector('.slider-next-btn');
            const prevBtn = document.querySelector('.slider-prev-btn');

            let isBusy = false;

            const shiftSlide = (direction) => {
                if (isBusy) return;
                isBusy = true;

                const targetSlide = direction === 'next' ? WINDOW_SIZE + 1 : WINDOW_SIZE - 1;

                swiper.slideTo(targetSlide, 350, true);

                setTimeout(() => {
                    if (direction === 'next') {
                        curIndex = (curIndex + 1) % activeList.length;
                    } else {
                        curIndex = (curIndex - 1 + activeList.length) % activeList.length;
                    }

                    wrapper.innerHTML = buildWindowHtml(curIndex);
                    swiper.update();
                    swiper.slideTo(WINDOW_SIZE, 0, false);
                    updatePagination();
                    isBusy = false;
                }, 360);
            };

            nextBtn.onclick = () => shiftSlide('next');
            prevBtn.onclick = () => shiftSlide('prev');

            swiper.on('slideChange', () => {
                if (isBusy) return;
                if (swiper.activeIndex > WINDOW_SIZE) {
                    shiftSlide('next');
                } else if (swiper.activeIndex < WINDOW_SIZE) {
                    shiftSlide('prev');
                }
            });
        }

        function filterGallery(category, tabElement) {
            document.querySelectorAll('.filter-tab').forEach(tab => tab.classList.remove('active'));
            if (tabElement) {
                tabElement.classList.add('active');
            }

            const items = photoData[category] || photoData.mani2025;
            initWindowedSwiper(items);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const defaultTab = document.querySelector('.filter-tab');
            filterGallery('mani2025', defaultTab);
        });

        window.addEventListener('load', () => {
            const intro = document.getElementById('introOverlay');
            setTimeout(() => {
                if (intro) {
                    intro.classList.add('hide');
                }
            }, 2000);
        });

        function openFormPopup() {
            const formUrl = "https://docs.google.com/forms/d/e/1FAIpQLSfi3yc2SjxW4avX0KEG05gCc7Qm8i3ABq9QHa5CF0OogXIJiw/viewform";
            const width = 640;
            const height = 800;
            const left = window.screen.width / 2 - width / 2;
            const top = window.screen.height / 2 - height / 2;

            window.open(
                formUrl,
                "GoogleFormPopup",
                `width=${width},height=${height},top=${top},left=${left},scrollbars=yes,resizable=yes`
            );
        }

        function toggleMenu() {
            const toggle = document.querySelector('.one');
            const navigation = document.querySelector('header ul.navigation');
            toggle.classList.toggle('active');
            navigation.classList.toggle('active');

            document.body.style.overflow = navigation.classList.contains('active')
                ? 'hidden'
                : '';
        }

        document.addEventListener("DOMContentLoaded", () => {
            const navLinks = document.querySelectorAll("header ul.navigation li a");
            const currentUrl = new URL(window.location.href);
            const currentPath = currentUrl.pathname.replace(/\/$/, "").toLowerCase();

            navLinks.forEach(link => {
                const href = link.getAttribute("href");
                if (!href) return;

                const linkUrl = new URL(href, window.location.origin);
                const linkPath = linkUrl.pathname.replace(/\/$/, "").toLowerCase();

                const isMatch = (currentPath === linkPath) || 
                                (linkPath.endsWith("index.html") && (currentPath === "" || currentPath === "/"));

                if (isMatch) {
                    link.classList.add("active");
                } else {
                    link.classList.remove("active");
                }
            });
        });
    </script>
</body>
</html>
