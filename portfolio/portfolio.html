<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nails by Joy</title>

    <link rel="stylesheet" href="https://unpkg.com/swiper@8/swiper-bundle.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="logo.png" type="image/x-icon">
    <script src="one.js"></script>
    <script src="https://kit.fontawesome.com/5d7cbd0185.js" crossorigin="anonymous"></script>
</head>

<body>

    <div class="intro-overlay" id="introOverlay">
        <div class="intro-content">
            <img src="logo.png" class="intro-logo-img" alt="Nails by Joy Logo">
            <h1 class="intro-title">Nails by Joy</h1>
            <p class="intro-subtitle">Elegance at Your Fingertips</p>
        </div>
    </div>

    <header>
        <a href="index.html">
            <img src="logo.png" class="logo" alt="Nails by Joy Logo">
        </a>

        <a href="index.html">
            <h1>Nails by Joy</h1>
        </a>

        <div class="one" onclick="toggleMenu();"></div>

        <ul class="navigation">
            <li><a href="index.html">Home</a></li>
            <li><a href="portfolio/portfolio.html">Portfolio</a></li>
            <li><a href="pricelist/pricelist.html">Price List</a></li>
            <li><a href="policies/policies.html">Policies</a></li>

            <li>
                <button class="open-form-btn" onclick="openFormPopup()">Book Here</button>
            </li>
        </ul>
    </header>

    <div class="container">
        <div class="top-content">
            <button class="filter-tab active" onclick="filterGallery('mani2025', this)">Manicure (2025)</button>
            <button class="filter-tab" onclick="filterGallery('mani2026', this)">Manicure (2026)</button>
            <button class="filter-tab" onclick="filterGallery('pedi2026', this)">Pedicure (2026)</button>
        </div>
    </div>

    <section id="arigato">
        <div class="konteyner">
            <div class="swiper arigato-slider">
                <div class="swiper-wrapper" id="swiperWrapper">
                    </div>

                <div class="arigato-slider-control">
                    <div class="slider-arrow slider-prev-btn">
                        <ion-icon name="arrow-back-outline"></ion-icon>
                    </div>
                    
                    <div class="swiper-pagination slider-dots"></div>
                    
                    <div class="slider-arrow slider-next-btn">
                        <ion-icon name="arrow-forward-outline"></ion-icon>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
    <script src="https://unpkg.com/swiper@8/swiper-bundle.min.js"></script>

    <script>
        // Photo library categorized by filter
        const photoData = {
            mani2025: [
                { img: "portfolio/images/(2025) manicure-20260901t092130z-1-001/(2025) manicure/1.jpg", title: "" },
                ...Array.from({ length: 25 }, (_, i) => ({
                    img: `portfolio/images/(2025) manicure-20260901t092130z-1-001/(2025) manicure/${i + 2}.PNG`,
                    title: ""
                }))
            ],
            mani2026: Array.from({ length: 111 }, (_, i) => ({
                img: `portfolio/images/(2026) manicure-20260901T114234Z-1-001/(2026) manicure/${i + 1}.PNG`,
                title: ""
            })),
            pedi2026: Array.from({ length: 7 }, (_, i) => ({
                img: `portfolio/images/(2026) pedicure-20260901T123702Z-1-001/(2026) pedicure/${i + 1}.PNG`,
                title: ""
            }))
        };

        let swiper = null;

        function initSwiper() {
            if (swiper) {
                swiper.destroy(true, true);
            }

            swiper = new Swiper('.arigato-slider', {
                effect: 'coverflow',
                grabCursor: true,
                centeredSlides: true,
                loop: true,
                slidesPerView: 'auto',
                coverflowEffect: {
                    rotate: 0,
                    stretch: 0,
                    depth: 100,
                    modifier: 2.5,
                },
                pagination: {
                    el: '.swiper-pagination',
                    type: 'fraction',
                },
                navigation: {
                    nextEl: '.slider-next-btn',
                    prevEl: '.slider-prev-btn',
                }
            });
        }

        // Switch slides and re-sync Swiper when tab clicked
        function filterGallery(category, tabElement) {
            document.querySelectorAll('.filter-tab').forEach(tab => tab.classList.remove('active'));
            if (tabElement) {
                tabElement.classList.add('active');
            }

            const wrapper = document.getElementById('swiperWrapper');
            const items = photoData[category] || photoData.mani2025;

            wrapper.innerHTML = items.map((item, index) => `
                <div class="swiper-slide arigato-slide">
                    <div class="arigato-weee-img">
                        <img src="${item.img}" alt="${item.title}">
                    </div>
                    <div class="arigato-kontint-gosaymas">
                        <h1 class="number">${index + 1}</h1>
                        <div class="arigato-kontint-gosaymas-bottom">
                            <h2 class="pangalan">${item.title}</h2>
                        </div>
                    </div>
                </div>
            `).join('');

            initSwiper();
        }

        // Load Manicure (2025) photos on initial load
        window.addEventListener('DOMContentLoaded', () => {
            const defaultTab = document.querySelector('.filter-tab');
            filterGallery('mani2025', defaultTab);
        });

        // Dismiss intro animation after 2 seconds
        window.addEventListener('load', () => {
            const intro = document.getElementById('introOverlay');
            setTimeout(() => {
                if (intro) {
                    intro.classList.add('hide');
                }
            }, 2000);
        });

        // Booking popup
        function openFormPopup() {
            const formUrl = "https://docs.google.com/forms/d/e/1FAIpQLSfi3yc2SjxW4avX0KEG05gCc7Qm8i3ABq9QHa5CF0OogXIJiw/viewform";
            const width = 640;
            const height = 800;
            const left = window.screen.width / 2 - width / 2;
            const top = window.screen.height / 2 - height / 2;

            window.open(
                formUrl,
                "GoogleFormPopup",
                `width=${width},height=${height},top=${top},left=${left},scrollbars=yes,resizable=yes`
            );
        }

        // Toggle mobile navigation
        function toggleMenu() {
            const toggle = document.querySelector('.one');
            const navigation = document.querySelector('header ul.navigation');
            toggle.classList.toggle('active');
            navigation.classList.toggle('active');

            document.body.style.overflow = navigation.classList.contains('active')
                ? 'hidden'
                : '';
        }

        // Navigation active indicator
        document.addEventListener("DOMContentLoaded", () => {
            const navLinks = document.querySelectorAll("header ul.navigation li a");
            const currentPath = window.location.pathname;

            navLinks.forEach(link => {
                const href = link.getAttribute("href");
                if (href && (currentPath.includes(href) || window.location.href === link.href)) {
                    link.classList.add("active");
                } else if (
                    (currentPath === "/" || currentPath.endsWith("index.html")) &&
                    link.textContent.trim().toLowerCase() === "home"
                ) {
                    link.classList.add("active");
                }

                link.addEventListener("click", () => {
                    navLinks.forEach(item => item.classList.remove("active"));
                    link.classList.add("active");
                });
            });
        });
    </script>
</body>
</html>
